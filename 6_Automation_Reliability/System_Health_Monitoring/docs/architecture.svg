<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">Host health, made observable.</title><desc id="desc">One-shot Python checks / explicit status / optional notification. Schedule: Cron or a manual command invokes the same one-shot check. Collect: Sample CPU over an interval; inspect disk, memory and localhost. Evaluate: Classify threshold breaches and probe failures independently. Report: Write timestamped JSON and exit 0, 1, 2 or 3 for automation. Notify, if enabled: Use authenticated STARTTLS SMTP only when explicitly requested. Act on the signal: Review an alert or failed probe; keep credentials outside the code. Verified: unit contracts and a real local host sample. SMTP delivery is a separate integration check.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="130.84" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Host health, made observable.</text><text x="50" y="179.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">One-shot Python checks / explicit status / optional notification</text><path d="M 465 362.5 L 503 362.5" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="503,362.5 491.5914266954251,368.7325320018546 491.5914266954251,356.2674679981454" fill="#75e4c3"/><path d="M 930 362.5 L 968 362.5" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="968,362.5 956.5914266954252,368.7325320018546 956.5914266954252,356.2674679981454" fill="#75e4c3"/><path d="M 1185.0 458 L 1185.0 523" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="1185.0,523 1178.7674679981453,511.5914266954252 1191.2325320018547,511.5914266954251" fill="#75e4c3"/><path d="M 975 627.5 L 937 627.5" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="937,627.5 948.4085733045748,621.2674679981453 948.4085733045748,633.7325320018547" fill="#75e4c3"/><path d="M 510 627.5 L 472 627.5" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="472,627.5 483.4085733045748,621.2674679981453 483.4085733045749,633.7325320018547" fill="#75e4c3"/><rect x="50" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="304.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="73" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Schedule</text><text x="73" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Cron or a manual command invokes</text><text x="73" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">the same one-shot check.</text><rect x="515" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="538" y="304.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="538" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Collect</text><text x="538" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Sample CPU over an interval;</text><text x="538" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">inspect disk, memory and</text><text x="538" y="434.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">localhost.</text><rect x="980" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="1003" y="304.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="1003" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Evaluate</text><text x="1003" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Classify threshold breaches and</text><text x="1003" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">probe failures independently.</text><rect x="980" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="1003" y="569.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">04</text><text x="1003" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Report</text><text x="1003" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Write timestamped JSON and exit</text><text x="1003" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">0, 1, 2 or 3 for automation.</text><rect x="515" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="538" y="569.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="538" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Notify, if enabled</text><text x="538" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Use authenticated STARTTLS SMTP</text><text x="538" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">only when explicitly requested.</text><rect x="50" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="569.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Act on the signal</text><text x="73" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Review an alert or failed probe;</text><text x="73" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">keep credentials outside the</text><text x="73" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">code.</text><path d="M 50 765 H 1390" stroke="#29465a"/><text x="50" y="799.94" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="839.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: unit contracts and a real local host sample. SMTP delivery is a separate integration check.</text></svg>