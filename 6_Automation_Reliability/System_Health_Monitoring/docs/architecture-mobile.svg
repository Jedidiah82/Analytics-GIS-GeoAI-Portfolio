<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2220" viewBox="0 0 600 2220" role="img" aria-labelledby="title desc"><title id="title">Host health, made observable.</title><desc id="desc">One-shot Python checks / explicit status / optional notification. Schedule: Cron or a manual command invokes the same one-shot check. Collect: Sample CPU over an interval; inspect disk, memory and localhost. Evaluate: Classify threshold breaches and probe failures independently. Report: Write timestamped JSON and exit 0, 1, 2 or 3 for automation. Notify, if enabled: Use authenticated STARTTLS SMTP only when explicitly requested. Act on the signal: Review an alert or failed probe; keep credentials outside the code. Verified: unit contracts and a real local host sample. SMTP delivery is a separate integration check.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="122.53999999999999" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Host health, made</text><text x="50" y="171.54" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">observable.</text><text x="50" y="234.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">One-shot Python checks / explicit</text><text x="50" y="264.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">status / optional notification</text><path d="M 300.0 568 L 300.0 598" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="300.0,598 293.7674679981454,586.5914266954252 306.2325320018546,586.5914266954252" fill="#75e4c3"/><path d="M 300.0 848 L 300.0 878" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="300.0,878 293.7674679981454,866.5914266954252 306.2325320018546,866.5914266954252" fill="#75e4c3"/><path d="M 300.0 1128 L 300.0 1158" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="300.0,1158 293.7674679981454,1146.591426695425 306.2325320018546,1146.591426695425" fill="#75e4c3"/><path d="M 300.0 1408 L 300.0 1438" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="300.0,1438 293.7674679981454,1426.591426695425 306.2325320018546,1426.591426695425" fill="#75e4c3"/><path d="M 300.0 1688 L 300.0 1718" stroke="#75e4c3" stroke-width="3" fill="none"/><polygon points="300.0,1718 293.7674679981454,1706.591426695425 306.2325320018546,1706.591426695425" fill="#75e4c3"/><rect x="50" y="330" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="364.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="73" y="400.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Schedule</text><text x="73" y="443.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Cron or a manual command invokes</text><text x="73" y="475.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">the same one-shot check.</text><rect x="50" y="610" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="644.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="73" y="680.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Collect</text><text x="73" y="723.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Sample CPU over an interval;</text><text x="73" y="755.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">inspect disk, memory and</text><text x="73" y="787.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">localhost.</text><rect x="50" y="890" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="924.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="73" y="960.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Evaluate</text><text x="73" y="1003.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Classify threshold breaches and</text><text x="73" y="1035.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">probe failures independently.</text><rect x="50" y="1170" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1204.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">04</text><text x="73" y="1240.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Report</text><text x="73" y="1283.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Write timestamped JSON and exit</text><text x="73" y="1315.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">0, 1, 2 or 3 for automation.</text><rect x="50" y="1450" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1484.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="73" y="1520.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Notify, if enabled</text><text x="73" y="1563.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Use authenticated STARTTLS SMTP</text><text x="73" y="1595.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">only when explicitly requested.</text><rect x="50" y="1730" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1764.6" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="1800.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Act on the signal</text><text x="73" y="1843.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Review an alert or failed probe;</text><text x="73" y="1875.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">keep credentials outside the</text><text x="73" y="1907.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">code.</text><path d="M 50 2020 H 550" stroke="#29465a"/><text x="50" y="2054.94" fill="#75e4c3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="2094.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: unit contracts and a real</text><text x="50" y="2122.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">local host sample. SMTP delivery is a</text><text x="50" y="2150.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">separate integration check.</text></svg>