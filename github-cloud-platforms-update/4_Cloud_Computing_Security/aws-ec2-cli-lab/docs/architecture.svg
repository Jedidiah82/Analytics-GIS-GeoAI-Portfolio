<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">A controlled cloud lifecycle.</title><desc id="desc">EC2 / identity checks / observable state / owned-resource cleanup. Configure: Select the account, region, approved image, subnet and SSH /32. Review the plan: Default execution prints a plan without calling AWS. Check the boundary: Explicit execution verifies account, SSH rules and image metadata. Provision + persist: Create one tagged instance with IMDSv2 and encrypted root storage. Observe: Wait for running state and configure a CPU alarm without email actions. Retire owned resources: Match account and tags; terminate, wait, then remove the run alarm. Verified: offline plans and mocked lifecycle contracts. New live provisioning and cleanup are not executed.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="130.84" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">A controlled cloud lifecycle.</text><text x="50" y="179.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">EC2 / identity checks / observable state / owned-resource cleanup</text><path d="M 465 362.5 L 503 362.5" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="503,362.5 491.5914266954251,368.7325320018546 491.5914266954251,356.2674679981454" fill="#f4bf70"/><path d="M 930 362.5 L 968 362.5" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="968,362.5 956.5914266954252,368.7325320018546 956.5914266954252,356.2674679981454" fill="#f4bf70"/><path d="M 1185.0 458 L 1185.0 523" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="1185.0,523 1178.7674679981453,511.5914266954252 1191.2325320018547,511.5914266954251" fill="#f4bf70"/><path d="M 975 627.5 L 937 627.5" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="937,627.5 948.4085733045748,621.2674679981453 948.4085733045748,633.7325320018547" fill="#f4bf70"/><path d="M 510 627.5 L 472 627.5" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="472,627.5 483.4085733045748,621.2674679981453 483.4085733045749,633.7325320018547" fill="#f4bf70"/><rect x="50" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="304.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="73" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Configure</text><text x="73" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Select the account, region,</text><text x="73" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">approved image, subnet and SSH</text><text x="73" y="434.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">/32.</text><rect x="515" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="538" y="304.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="538" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Review the plan</text><text x="538" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Default execution prints a plan</text><text x="538" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">without calling AWS.</text><rect x="980" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="1003" y="304.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="1003" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Check the boundary</text><text x="1003" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Explicit execution verifies</text><text x="1003" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">account, SSH rules and image</text><text x="1003" y="434.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">metadata.</text><rect x="980" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="1003" y="569.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">04</text><text x="1003" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Provision + persist</text><text x="1003" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Create one tagged instance with</text><text x="1003" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">IMDSv2 and encrypted root</text><text x="1003" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">storage.</text><rect x="515" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="538" y="569.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="538" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Observe</text><text x="538" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Wait for running state and</text><text x="538" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">configure a CPU alarm without</text><text x="538" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">email actions.</text><rect x="50" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="569.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Retire owned resources</text><text x="73" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Match account and tags;</text><text x="73" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">terminate, wait, then remove the</text><text x="73" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">run alarm.</text><path d="M 50 765 H 1390" stroke="#29465a"/><text x="50" y="799.94" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="839.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: offline plans and mocked lifecycle contracts. New live provisioning and cleanup are not executed.</text></svg>