<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2220" viewBox="0 0 600 2220" role="img" aria-labelledby="title desc"><title id="title">A controlled cloud lifecycle.</title><desc id="desc">EC2 / identity checks / observable state / owned-resource cleanup. Configure: Select the account, region, approved image, subnet and SSH /32. Review the plan: Default execution prints a plan without calling AWS. Check the boundary: Explicit execution verifies account, SSH rules and image metadata. Provision + persist: Create one tagged instance with IMDSv2 and encrypted root storage. Observe: Wait for running state and configure a CPU alarm without email actions. Retire owned resources: Match account and tags; terminate, wait, then remove the run alarm. Verified: offline plans and mocked lifecycle contracts. New live provisioning and cleanup are not executed.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="122.53999999999999" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">A controlled cloud</text><text x="50" y="171.54" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">lifecycle.</text><text x="50" y="234.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">EC2 / identity checks / observable</text><text x="50" y="264.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">state / owned-resource cleanup</text><path d="M 300.0 568 L 300.0 598" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="300.0,598 293.7674679981454,586.5914266954252 306.2325320018546,586.5914266954252" fill="#f4bf70"/><path d="M 300.0 848 L 300.0 878" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="300.0,878 293.7674679981454,866.5914266954252 306.2325320018546,866.5914266954252" fill="#f4bf70"/><path d="M 300.0 1128 L 300.0 1158" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="300.0,1158 293.7674679981454,1146.591426695425 306.2325320018546,1146.591426695425" fill="#f4bf70"/><path d="M 300.0 1408 L 300.0 1438" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="300.0,1438 293.7674679981454,1426.591426695425 306.2325320018546,1426.591426695425" fill="#f4bf70"/><path d="M 300.0 1688 L 300.0 1718" stroke="#f4bf70" stroke-width="3" fill="none"/><polygon points="300.0,1718 293.7674679981454,1706.591426695425 306.2325320018546,1706.591426695425" fill="#f4bf70"/><rect x="50" y="330" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="364.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="73" y="400.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Configure</text><text x="73" y="443.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Select the account, region,</text><text x="73" y="475.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">approved image, subnet and SSH</text><text x="73" y="507.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">/32.</text><rect x="50" y="610" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="644.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="73" y="680.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Review the plan</text><text x="73" y="723.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Default execution prints a plan</text><text x="73" y="755.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">without calling AWS.</text><rect x="50" y="890" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="924.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="73" y="960.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Check the boundary</text><text x="73" y="1003.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Explicit execution verifies</text><text x="73" y="1035.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">account, SSH rules and image</text><text x="73" y="1067.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">metadata.</text><rect x="50" y="1170" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1204.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">04</text><text x="73" y="1240.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Provision + persist</text><text x="73" y="1283.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Create one tagged instance with</text><text x="73" y="1315.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">IMDSv2 and encrypted root</text><text x="73" y="1347.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">storage.</text><rect x="50" y="1450" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1484.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="73" y="1520.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Observe</text><text x="73" y="1563.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Wait for running state and</text><text x="73" y="1595.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">configure a CPU alarm without</text><text x="73" y="1627.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">email actions.</text><rect x="50" y="1730" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1764.6" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="1800.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Retire owned resources</text><text x="73" y="1843.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Match account and tags;</text><text x="73" y="1875.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">terminate, wait, then remove the</text><text x="73" y="1907.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">run alarm.</text><path d="M 50 2020 H 550" stroke="#29465a"/><text x="50" y="2054.94" fill="#f4bf70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="2094.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: offline plans and mocked</text><text x="50" y="2122.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">lifecycle contracts. New live</text><text x="50" y="2150.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">provisioning and cleanup are not</text><text x="50" y="2178.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">executed.</text></svg>