<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">Trust the verification, not the file.</title><desc id="desc">Synthetic message / isolated OpenPGP keyring / positive and negative checks. Isolate the run: Create a new disposable GnuPG home, separate from existing keys. Generate test keys: Create an Ed25519 signing key and a Curve25519 encryption subkey. Encrypt + recover: Encrypt synthetic text, decrypt it and compare the recovered bytes. Sign: Produce a detached signature with a passphrase-protected test key. Verify: Require a valid signature status for the unchanged message. Challenge integrity: Modify the message; require signature verification to reject it. Verified: four real GnuPG checks and offline orchestration tests. Azure Key Vault remains a separate plan.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="130.84" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Trust the verification, not the file.</text><text x="50" y="179.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Synthetic message / isolated OpenPGP keyring / positive and negative checks</text><path d="M 465 362.5 L 503 362.5" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="503,362.5 491.5914266954251,368.7325320018546 491.5914266954251,356.2674679981454" fill="#c9b0ff"/><path d="M 930 362.5 L 968 362.5" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="968,362.5 956.5914266954252,368.7325320018546 956.5914266954252,356.2674679981454" fill="#c9b0ff"/><path d="M 1185.0 458 L 1185.0 523" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="1185.0,523 1178.7674679981453,511.5914266954252 1191.2325320018547,511.5914266954251" fill="#c9b0ff"/><path d="M 975 627.5 L 937 627.5" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="937,627.5 948.4085733045748,621.2674679981453 948.4085733045748,633.7325320018547" fill="#c9b0ff"/><path d="M 510 627.5 L 472 627.5" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="472,627.5 483.4085733045748,621.2674679981453 483.4085733045749,633.7325320018547" fill="#c9b0ff"/><rect x="50" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="304.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="73" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Isolate the run</text><text x="73" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Create a new disposable GnuPG</text><text x="73" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">home, separate from existing</text><text x="73" y="434.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">keys.</text><rect x="515" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="538" y="304.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="538" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Generate test keys</text><text x="538" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Create an Ed25519 signing key</text><text x="538" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">and a Curve25519 encryption</text><text x="538" y="434.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">subkey.</text><rect x="980" y="270" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="1003" y="304.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="1003" y="339.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Encrypt + recover</text><text x="1003" y="380.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Encrypt synthetic text, decrypt</text><text x="1003" y="407.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">it and compare the recovered</text><text x="1003" y="434.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">bytes.</text><rect x="980" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="1003" y="569.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">04</text><text x="1003" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Sign</text><text x="1003" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Produce a detached signature</text><text x="1003" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">with a passphrase-protected test</text><text x="1003" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">key.</text><rect x="515" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="538" y="569.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="538" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Verify</text><text x="538" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Require a valid signature status</text><text x="538" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">for the unchanged message.</text><rect x="50" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="569.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Challenge integrity</text><text x="73" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Modify the message; require</text><text x="73" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">signature verification to reject</text><text x="73" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">it.</text><path d="M 50 765 H 1390" stroke="#29465a"/><text x="50" y="799.94" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="839.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: four real GnuPG checks and offline orchestration tests. Azure Key Vault remains a separate plan.</text></svg>