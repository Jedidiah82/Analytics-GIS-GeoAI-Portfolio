ht="700">Serve through Azure</text><text x="538" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Static Web Apps hosts the</text><text x="538" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">artifact and applies its</text><text x="538" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">configuration.</text><rect x="50" y="535" width="410" height="185" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="569.6" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="604.75" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Verify the endpoint</text><text x="73" y="645.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Check HTTPS, content, response</text><text x="73" y="672.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">headers and an actual missing-</text><text x="73" y="699.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">page 404.</text><path d="M 50 765 H 1390" stroke="#29465a"/><text x="50" y="799.94" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="839.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: local artifact checks. Azure deployment, response headers and public availability await live</text><text x="50" y="867.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">verification.</text></svg>