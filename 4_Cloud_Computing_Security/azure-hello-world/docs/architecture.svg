<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">Source to a reviewable release.</title><desc id="desc">Static HTML / validated artifact / manually dispatched deployment. Version the source: HTML, CSS and hosting configuration live in the project folder. Validate the artifact: Check structure, local assets, 404 behavior and header configuration. Choose a release: A manual main-branch dispatch starts the deployment job after checks. Deploy the artifact: A scoped repository secret supplies the Azure deployment token. Serve through Azure: Static Web Apps hosts the artifact and applies its configuration. Verify the endpoint: Check HTTPS, content, response headers and an actual missing-page 404. Verified: local artifact checks. Azure deployment, response headers and public availability await live verification.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="130.84" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Source to a reviewable release.</text><text x="50" y="179.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Static HTML / validated artifact / manually dispatched deployment</text><path d="M 465 362.5 L 503 362.5" stroke="#82c9ff" stroke-width="3" fill="none"/><polygon points="503,362.5 491.5914266954251,368.7325320018546 491.5914266954251,356.2674679981454" fill="#82c9ff"/><path d="M 930 362.5 L 968 362.5" stroke="#82c9ff" stroke-width="3" fill="none"/><polygon points="968,362.5 956.5914266954252,368.7325320018546 956.5914266954252,356.2674679981454" fill="#82c9ff"/><path d="M 1185.0 458 L 1185.0 523" stroke="#82c9ff" stroke-width="3" fill="none"/><polygon points="1185.0,523 1178.767467998145