th="2"/><text x="73" y="1484.6" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="73" y="1520.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Serve through Azure</text><text x="73" y="1563.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Static Web Apps hosts the</text><text x="73" y="1595.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">artifact and applies its</text><text x="73" y="1627.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">configuration.</text><rect x="50" y="1730" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1764.6" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="1800.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Verify the endpoint</text><text x="73" y="1843.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Check HTTPS, content, response</text><text x="73" y="1875.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">headers and an actual missing-</text><text x="73" y="1907.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">page 404.</text><path d="M 50 2020 H 550" stroke="#29465a"/><text x="50" y="2054.94" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="2094.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: local artifact checks.</text><text x="50" y="2122.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Azure deployment, response headers</text><text x="50" y="2150.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">and public availability await live</text><text x="50" y="2178.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">verification.</text></svg>