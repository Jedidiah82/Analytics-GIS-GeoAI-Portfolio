<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2220" viewBox="0 0 600 2220" role="img" aria-labelledby="title desc"><title id="title">Source to a reviewable release.</title><desc id="desc">Static HTML / validated artifact / manually dispatched deployment. Version the source: HTML, CSS and hosting configuration live in the project folder. Validate the artifact: Check structure, local assets, 404 behavior and header configuration. Choose a release: A manual main-branch dispatch starts the deployment job after checks. Deploy the artifact: A scoped repository secret supplies the Azure deployment token. Serve through Azure: Static Web Apps hosts the artifact and applies its configuration. Verify the endpoint: Check HTTPS, content, response headers and an actual missing-page 404. Verified: local artifact checks. Azure deployment, response headers and public availability await live verification.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#82c9ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="122.53999999999999" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Source to a reviewable</text><text x="50" y="171.54" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">release.</text><text x="50" y="234.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Static HTML / validated artifact /</text><text x="50" y="264.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">manually dispatched deployment</text><path d="M 300.0 568 L 300.0 598" stroke="#82c9ff" stroke-width="3" fill="none"/><polygon points="300.0,598 293.7674679981454,586.5914266954252 306.2325320018546,586.5914266954252" fill="#82c9ff"/><path d="M 300.0 848 L 300.0 878" stroke="#82c9ff" stroke-width="3" fill=