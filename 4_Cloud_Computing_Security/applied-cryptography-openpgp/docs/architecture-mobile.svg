<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2220" viewBox="0 0 600 2220" role="img" aria-labelledby="title desc"><title id="title">Trust the verification, not the file.</title><desc id="desc">Synthetic message / isolated OpenPGP keyring / positive and negative checks. Isolate the run: Create a new disposable GnuPG home, separate from existing keys. Generate test keys: Create an Ed25519 signing key and a Curve25519 encryption subkey. Encrypt + recover: Encrypt synthetic text, decrypt it and compare the recovered bytes. Sign: Produce a detached signature with a passphrase-protected test key. Verify: Require a valid signature status for the unchanged message. Challenge integrity: Modify the message; require signature verification to reject it. Verified: four real GnuPG checks and offline orchestration tests. Azure Key Vault remains a separate plan.</desc><rect width="100%" height="100%" fill="#081522"/><text x="50" y="55.769999999999996" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">GODWIN ETIM AKPAN / CLOUD ENGINEERING</text><text x="50" y="122.53999999999999" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Trust the verification,</text><text x="50" y="171.54" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">not the file.</text><text x="50" y="234.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Synthetic message / isolated OpenPGP</text><text x="50" y="264.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">keyring / positive and negative</text><text x="50" y="294.09" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">checks</text><path d="M 300.0 568 L 300.0 598" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="300.0,598 293.7674679981454,586.5914266954252 306.2325320018546,586.5914266954252" fill="#c9b0ff"/><path d="M 300.0 848 L 300.0 878" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="300.0,878 293.7674679981454,866.5914266954252 306.2325320018546,866.5914266954252" fill="#c9b0ff"/><path d="M 300.0 1128 L 300.0 1158" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="300.0,1158 293.7674679981454,1146.591426695425 306.2325320018546,1146.591426695425" fill="#c9b0ff"/><path d="M 300.0 1408 L 300.0 1438" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="300.0,1438 293.7674679981454,1426.591426695425 306.2325320018546,1426.591426695425" fill="#c9b0ff"/><path d="M 300.0 1688 L 300.0 1718" stroke="#c9b0ff" stroke-width="3" fill="none"/><polygon points="300.0,1718 293.7674679981454,1706.591426695425 306.2325320018546,1706.591426695425" fill="#c9b0ff"/><rect x="50" y="330" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="364.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="73" y="400.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Isolate the run</text><text x="73" y="443.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Create a new disposable GnuPG</text><text x="73" y="475.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">home, separate from existing</text><text x="73" y="507.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">keys.</text><rect x="50" y="610" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="644.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="73" y="680.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Generate test keys</text><text x="73" y="723.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Create an Ed25519 signing key and</text><text x="73" y="755.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">a Curve25519 encryption subkey.</text><rect x="50" y="890" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="924.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="73" y="960.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Encrypt + recover</text><text x="73" y="1003.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Encrypt synthetic text, decrypt</text><text x="73" y="1035.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">it and compare the recovered</text><text x="73" y="1067.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">bytes.</text><rect x="50" y="1170" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1204.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">04</text><text x="73" y="1240.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Sign</text><text x="73" y="1283.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Produce a detached signature with</text><text x="73" y="1315.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">a passphrase-protected test key.</text><rect x="50" y="1450" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1484.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">05</text><text x="73" y="1520.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Verify</text><text x="73" y="1563.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Require a valid signature status</text><text x="73" y="1595.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">for the unchanged message.</text><rect x="50" y="1730" width="500" height="235" rx="20" fill="#10283b" stroke="#29465a" stroke-width="2"/><text x="73" y="1764.6" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">06</text><text x="73" y="1800.58" fill="#ecf4fa" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Challenge integrity</text><text x="73" y="1843.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">Modify the message; require</text><text x="73" y="1875.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">signature verification to reject</text><text x="73" y="1907.58" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400">it.</text><path d="M 50 2020 H 550" stroke="#29465a"/><text x="50" y="2054.94" fill="#c9b0ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VERIFICATION BOUNDARY</text><text x="50" y="2094.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified: four real GnuPG checks and</text><text x="50" y="2122.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">offline orchestration tests. Azure</text><text x="50" y="2150.26" fill="#b2c7d8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Key Vault remains a separate plan.</text></svg>